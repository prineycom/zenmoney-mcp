# cargo-deny configuration
# Run with: cargo deny check

[graph]
all-features = true
no-default-features = false

# -- Advisories --
[advisories]
# Check all crates (workspace + transitive) for unmaintained advisories
unmaintained = "all"
# Check only workspace crates for unsound advisories
unsound = "workspace"
# Deny yanked crate versions
yanked = "deny"
# Fork note: upstream (sakost/zenmoney-mcp master) also carries these advisories in
# transitive deps (h2, rustls, brotli via hyper/reqwest). Ignored to unblock the fork
# build; the MCP server is stdio-only and talks to api.zenmoney.ru over HTTPS, which
# limits exposure. Revisit when upstream bumps the dependency tree.
ignore = [
    "RUSTSEC-2026-0258", # h2 unbounded empty DATA frames
    "RUSTSEC-2026-0285", # rustls TLS 1.3 handshake cross-level acceptance
    "RUSTSEC-2026-0346", # rustls Debug impls expose TLS secrets
    "RUSTSEC-2026-0348", # brotli certificate decompression pre-auth allocation
    "RUSTSEC-2026-0349", # rustls ServerHello downgrade
]

# -- Licenses --
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# -- Bans --
[bans]
multiple-versions = "warn"
# "unknown" wildcard crates (git deps without a version) are allowed in this fork:
# zenmoney-rs is pinned via git to the fix/deleted-transactions branch.
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

# -- Sources --
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/prineycom/zenmoney-rs.git"]
